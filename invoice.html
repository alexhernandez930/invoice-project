<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>Invoice</title>

    <link rel="stylesheet" href="invoice.css" />
  </head>

  <body>
    <div class="invoice">
      <div class="title">
        <h1><i>Invoice</i></h1>
      </div>

      <!-- Making the very top of the invoice with the compnay name and logo -->
      <div class="top">
        <div class="logo">
          <img src="palm_cute.webp" />
        </div>

        <div class="user-info">
          <h2>Company Name</h2>
          <p>Address of company</p>
          <p>Phone Number</p>
          <p>Email address</p>
        </div>
      </div>
      <hr />

      <div class="invoice-info">
        <div class="invoice-customer-info">
          <p><b>Customer name</b></p>
          <address>1220 factory road</address>
          <address>san marcos ca 92078</address>
          <address>customer Phone</address>
        </div>

        <div class="invoice-num-date">
          <p>INV-0001</p>
          <data>October 12 20206</data>
        </div>
      </div>

      <footer>
        <p>Thank you for your business.</p>
      </footer>
    </div>
  </body>
</html>
