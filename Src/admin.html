<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="Administrator">Administrator</title>
    <link rel="stylesheet" href="create-invoice.css" />
    <script src="invoice-language.js" defer></script>
    <script src="password-strength.js" defer></script>
    <script src="password-feedback.js" defer></script>
    <script src="invoice-account.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="create-invoice.html">
        <img src="palm_cute.webp" width="40" height="40" alt="" />
        <span data-i18n="Invoice Maker">Invoice Maker</span>
      </a>
      <nav class="page-links" aria-label="Workspace" data-i18n-label="Workspace">
        <a href="create-invoice.html" data-i18n="Create invoice">Create invoice</a>
        <a href="invoices.html" data-i18n="Saved invoices">Saved invoices</a>
        <a href="admin.html" aria-current="page" data-i18n="Administrator">Administrator</a>
      </nav>
      <div class="account-controls">
        <button type="button" id="invoice-language" lang="es">Español</button>
        <span data-account-name></span>
        <button type="button" id="logout-invoice" data-i18n="Sign out" hidden>Sign out</button>
      </div>
    </header>

    <main class="container">
      <header class="workspace-heading">
        <h1 data-i18n="Administrator">Administrator</h1>
        <p data-i18n="Browse accounts and review invoices by creator.">Browse accounts and review invoices by creator.</p>
      </header>
      <section class="form-section">
        <h2 data-i18n="User accounts">User accounts</h2>
        <p id="admin-status" role="status"></p>
        <div class="items-scroll">
          <table class="account-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="Username">Username</th>
                <th scope="col" data-i18n="Role">Role</th>
                <th scope="col" data-i18n="Saved Invoices">Saved Invoices</th>
                <th scope="col" data-i18n="Password">Password</th>
              </tr>
            </thead>
            <tbody id="account-list"></tbody>
          </table>
        </div>
        <p class="lookup-hint"><a href="invoices.html?owner=legacy" data-i18n="Invoices created before accounts">Invoices created before accounts</a></p>
      </section>
    </main>

    <dialog id="reset-password-dialog" class="account-dialog" aria-labelledby="reset-password-title">
      <form id="reset-password-form" method="post">
        <h2 id="reset-password-title" data-i18n="Reset password">Reset password</h2>
        <p class="reset-target"><span data-i18n="User">User</span> <strong id="reset-username"></strong></p>
        <p class="lookup-hint" data-i18n="Saving a new password signs this user out of all sessions.">
          Saving a new password signs this user out of all sessions.
        </p>
        <label for="reset-password" data-i18n="New password">New password</label>
        <input id="reset-password" type="password" autocomplete="new-password" maxlength="128" required
          aria-describedby="password-strength-text" autofocus />
        <div class="password-strength">
          <meter id="password-strength" min="0" max="3" low="1" high="2" optimum="3" value="0"
            aria-label="Password strength" data-i18n-label="Password strength"></meter>
          <p id="password-strength-text" role="status"></p>
        </div>
        <label for="password-confirmation" data-i18n="Confirm password">Confirm password</label>
        <input id="password-confirmation" type="password" autocomplete="new-password" maxlength="128"
          aria-describedby="password-match" required />
        <p id="password-match" class="password-match" role="status"></p>
        <p id="reset-password-error" class="password-error" role="alert" hidden></p>
        <div class="account-form-actions">
          <button id="cancel-password-reset" type="button" data-i18n="Cancel">Cancel</button>
          <button id="submit-password-reset" type="submit" class="primary-button" data-i18n="Save new password">Save new password</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
